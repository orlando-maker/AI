name: TailTrack
options:
  bundleIdPrefix: com.orlandonell
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

# To enable Google Sign-In: uncomment this packages block AND the
# GoogleSignIn dependency + GIDClientID/URL-scheme info entries in the
# TailTrack target below, then re-run `xcodegen generate`. See README.
# packages:
#   GoogleSignIn:
#     url: https://github.com/google/GoogleSignIn-iOS
#     from: "7.1.0"

targets:
  TailTrack:
    type: application
    platform: iOS
    sources:
      - path: TailTrack
        excludes:
          - "TailTrack.entitlements"
    info:
      path: TailTrack/Info.plist
      properties:
        CFBundleDisplayName: TailTrack
        CFBundleName: TailTrack
        UILaunchScreen:
          UIColorName: ""
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Google Sign-In config — fill in your OAuth iOS client ID from
        # console.cloud.google.com and uncomment (see README):
        # GIDClientID: "YOUR_CLIENT_ID.apps.googleusercontent.com"
        # CFBundleURLTypes:
        #   - CFBundleURLSchemes:
        #       - "com.googleusercontent.apps.YOUR_CLIENT_ID"
    # dependencies:
    #   - package: GoogleSignIn
    #     product: GoogleSignIn
    # Sign in with Apple requires a PAID Apple Developer account — with a
    # free personal team the entitlement makes signing (and the whole build)
    # fail. Building with a paid team? Uncomment this block and re-run
    # `xcodegen generate` to enable it.
    # entitlements:
    #   path: TailTrack/TailTrack.entitlements
    #   properties:
    #     com.apple.developer.applesignin:
    #       - Default
    settings:
      base:
        DEVELOPMENT_TEAM: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.orlandonell.tailtrack
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic

  TailTrackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TailTrackTests
    dependencies:
      - target: TailTrack
    settings:
      base:
        DEVELOPMENT_TEAM: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.orlandonell.tailtrack-tests
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic

schemes:
  TailTrack:
    build:
      targets:
        TailTrack: all
    run:
      config: Debug
      storeKitConfiguration: TailTrack.storekit
    test:
      config: Debug
      targets:
        - TailTrackTests
    archive:
      config: Release
