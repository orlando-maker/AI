name: TailTrack
options:
  bundleIdPrefix: com.orlandonell
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

targets:
  TailTrack:
    type: application
    platform: iOS
    sources:
      - path: TailTrack
        excludes:
          - "TailTrack.entitlements"
    info:
      path: TailTrack/Info.plist
      properties:
        CFBundleDisplayName: TailTrack
        CFBundleName: TailTrack
        UILaunchScreen:
          UIColorName: ""
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: TailTrack/TailTrack.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        DEVELOPMENT_TEAM: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.orlandonell.tailtrack
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic

  TailTrackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TailTrackTests
    dependencies:
      - target: TailTrack
    settings:
      base:
        DEVELOPMENT_TEAM: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.orlandonell.tailtrack-tests
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic

schemes:
  TailTrack:
    build:
      targets:
        TailTrack: all
    run:
      config: Debug
      storeKitConfiguration: TailTrack.storekit
    test:
      config: Debug
      targets:
        - TailTrackTests
    archive:
      config: Release
