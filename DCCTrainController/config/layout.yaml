# ============================================================
# DCC Train Layout Configuration
# All distances are in MILLIMETERS (mm)
# Fill this in once your layout is finalized
# ============================================================

cs3_plus:
  # Find your CS3+ IP: Menu → Settings → Network → IP Address
  ip: "192.168.1.100"
  port: 80

# ── TRAINS ──────────────────────────────────────────────────
#
# autonomous: true  → software drives the train (autopilot)
# autonomous: false → YOU drive it from the CS3+ handset; software ignores it
#
# stops_at_stations: true  → passenger train — full station stop + dwell
# stops_at_stations: false → cargo/express — slows slightly through stations, never stops
#
# track: which track this train runs on. Must match a route below.
#
# HOW TO FIND YOUR ADDRESS:
#   MFX locos: place on powered track → they self-register → use option [7] Scan to find address
#   DCC locos: program CV1 to your chosen address (never 3 — that's the factory default)

trains:
  # ── Track 1: your main passenger train (SNCB, ICE, etc.) ──
  - id: "passenger"
    name: "SNCB Brussels"
    protocol: "mfx"
    dcc_address: 1               # ← update after scanning with [7]
    track: "track_1"
    autonomous: true             # autopilot ON
    stops_at_stations: true      # stops at every station platform
    length_mm: 450               # measure your train nose-to-tail in mm
    max_speed_step: 75           # cruising speed (0–128)
    approach_speed_step: 18      # slow creep speed entering a station
    decel_distance_mm: 500       # 50cm before station: begin braking

  # ── Track 2: cargo / ICE — passes through without stopping ──
  - id: "cargo"
    name: "DB Cargo"
    protocol: "mfx"
    dcc_address: 2               # ← update after scanning with [7]
    track: "track_2"
    autonomous: true             # autopilot ON
    stops_at_stations: false     # cargo — never stops at stations
    length_mm: 620
    max_speed_step: 85
    approach_speed_step: 22
    decel_distance_mm: 400

  # ── Optional: a train YOU drive manually ──
  # (Leave this in; just set autonomous: false. Software won't touch it.)
  # - id: "manual_express"
  #   name: "My ICE"
  #   protocol: "mfx"
  #   dcc_address: 5
  #   track: "track_1"
  #   autonomous: false          # YOU drive this from the CS3+ handset
  #   stops_at_stations: true
  #   length_mm: 400
  #   max_speed_step: 90
  #   approach_speed_step: 20
  #   decel_distance_mm: 500

# ── BLOCKS ───────────────────────────────────────────────────
# A block = one isolated section of track with an s88 sensor.
# Cut both rails at each block boundary. One s88 contact per block.
# s88_address: the contact number on your s88 module (starts at 1).

blocks:
  # ── Track 1 blocks ──
  - id: "t1_station_A"
    name: "Main Station"
    track: "track_1"
    length_mm: 600
    is_station: true
    platform_length_mm: 550
    s88_address: 1

  - id: "t1_run_1"
    name: "Track 1 — East Run"
    track: "track_1"
    length_mm: 1000             # fill in your actual distance
    is_station: false
    s88_address: 2

  - id: "t1_station_B"
    name: "Village Station"
    track: "track_1"
    length_mm: 500
    is_station: true
    platform_length_mm: 450
    s88_address: 3

  - id: "t1_run_2"
    name: "Track 1 — West Return"
    track: "track_1"
    length_mm: 1000
    is_station: false
    s88_address: 4

  # ── Track 2 blocks ──
  - id: "t2_run_1"
    name: "Track 2 — Outbound"
    track: "track_2"
    length_mm: 1200
    is_station: false
    s88_address: 5

  - id: "t2_station"
    name: "Track 2 — Goods Halt"
    track: "track_2"
    length_mm: 600
    is_station: true            # cargo will slow here but not stop
    platform_length_mm: 550
    s88_address: 6

  - id: "t2_run_2"
    name: "Track 2 — Return"
    track: "track_2"
    length_mm: 1200
    is_station: false
    s88_address: 7

# ── SIGNALS ──────────────────────────────────────────────────
signals:
  - id: "signal_1"
    name: "Main Station Entry"
    dcc_address: 101
    protects_block: "t1_station_A"

  - id: "signal_2"
    name: "Village Station Entry"
    dcc_address: 102
    protects_block: "t1_station_B"

# ── ROUTES ───────────────────────────────────────────────────
# List blocks in the order the train travels through them.
routes:
  - id: "route_track_1"
    name: "Track 1 — Passenger Loop"
    track: "track_1"
    loop: true
    blocks:
      - "t1_station_A"
      - "t1_run_1"
      - "t1_station_B"
      - "t1_run_2"

  - id: "route_track_2"
    name: "Track 2 — Cargo Loop"
    track: "track_2"
    loop: true
    blocks:
      - "t2_run_1"
      - "t2_station"
      - "t2_run_2"

# ── STATION DWELL TIMES ──────────────────────────────────────
station_dwell:
  default_seconds: 15           # how long trains wait at each station
  overrides:
    t1_station_A: 20            # main station gets a longer stop
    t1_station_B: 10
