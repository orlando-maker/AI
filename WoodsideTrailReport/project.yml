name: WoodsideTrailReport
options:
  bundleIdPrefix: com.orlandonell
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  WoodsideTrailReport:
    type: application
    platform: iOS
    sources:
      - path: WoodsideTrailReport
        excludes:
          - "WoodsideTrailReport.entitlements"
    resources:
      - path: WoodsideTrailReport/Resources
    info:
      path: WoodsideTrailReport/Info.plist
      properties:
        CFBundleDisplayName: Woodside Trail Report
        CFBundleName: WoodsideTrailReport
        UILaunchScreen:
          UIColorName: ""
        NSLocationWhenInUseUsageDescription: "Your location helps pin your report accurately on the map. Location is not stored or tracked."
        NSPhotoLibraryUsageDescription: "Attach photos from your library to show the issue you are reporting."
        NSCameraUsageDescription: "Take a photo of the issue directly in the app to attach to your report."
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: WoodsideTrailReport/WoodsideTrailReport.entitlements
    dependencies:
      - package: Supabase
        product: Supabase
      - target: WoodsideTrailReportWatch
        embed: true
    settings:
      base:
        DEVELOPMENT_TEAM: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.orlandonell.woodside-trail-report
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic

  WoodsideTrailReportWatch:
    type: application
    platform: watchOS
    sources:
      - path: WoodsideTrailReportWatch
        excludes:
          - "WoodsideTrailReportWatch.entitlements"
    info:
      path: WoodsideTrailReportWatch/Info.plist
      properties:
        CFBundleDisplayName: Woodside
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.orlandonell.woodside-trail-report
    entitlements:
      path: WoodsideTrailReportWatch/WoodsideTrailReportWatch.entitlements
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        DEVELOPMENT_TEAM: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.orlandonell.woodside-trail-report.watchkitapp
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
